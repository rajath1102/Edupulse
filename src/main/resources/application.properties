# ===================================================================
# EDUPULSE - Application Configuration
# ===================================================================

spring.application.name=edupulse
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Ensure MySQL service is running and 'edupulse' database is created:
# CREATE DATABASE IF NOT EXISTS edupulse;
spring.datasource.url=jdbc:mysql://localhost:3306/edupulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Google Gemini AI API Configuration
# Reads from environment variable GEMINI_API_KEY.
# If not configured, the application continues to function normally.
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

