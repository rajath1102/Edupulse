# ===================================================================
# EDUPULSE - Application Configuration
# ===================================================================

spring.application.name=edupulse
server.port=8080

# ===================================================================
# MySQL Database Configuration
# ===================================================================
# Ensure MySQL service is running and 'edupulse' database is created:
# CREATE DATABASE IF NOT EXISTS edupulse;
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edupulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# Google Gemini AI API Configuration
# Reads from environment variable GEMINI_API_KEY.
# If not configured, the application continues to function normally.
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# ===================================================================
# JWT & Security Configuration
# ===================================================================
# Default 256-bit key for local development. In production, provide JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 24 hours (86,400,000 milliseconds)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

